<!DOCTYPE html>
<html lang="tr" data-theme="pastel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Straw Muural ✰ Ortak Anı Panosu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #fcf6f0;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --primary: #ff6b8b;
            --primary-hover: #ff4770;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-glow: rgba(255, 107, 139, 0.2);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="pastel"] {
            --bg-main: #fcf6f0;
            --bg-card: rgba(255, 255, 255, 0.85);
            --border-color: rgba(230, 210, 200, 0.5);
            --primary: #ff758c;
            --primary-hover: #ff526d;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-glow: rgba(255, 117, 140, 0.2);
        }

        [data-theme="dark"] {
            --bg-main: #0f1016;
            --bg-card: rgba(24, 26, 38, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-glow: rgba(168, 85, 247, 0.25);
        }

        [data-theme="y2k"] {
            --bg-main: #120024;
            --bg-card: rgba(45, 0, 77, 0.8);
            --border-color: rgba(255, 0, 128, 0.3);
            --primary: #ff007f;
            --primary-hover: #e60073;
            --text-main: #00ffff;
            --text-muted: #ff80df;
            --accent-glow: rgba(255, 0, 127, 0.4);
        }

        [data-theme="cork"] {
            --bg-main: #c49a6c;
            --bg-card: rgba(245, 230, 205, 0.9);
            --border-color: rgba(139, 94, 60, 0.3);
            --primary: #8b5e3c;
            --primary-hover: #6f472b;
            --text-main: #3d2612;
            --text-muted: #7d5b3d;
            --accent-glow: rgba(139, 94, 60, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 24px 24px;
            padding-bottom: 120px;
        }

        header {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-badge {
            background: var(--primary);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .board-title-input {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-main);
            outline: none;
            width: 240px;
        }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); background: var(--primary-hover); }

        .role-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--accent-glow);
            color: var(--primary);
            font-weight: 800;
        }

        /* Canvas Workspace */
        .workspace {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            min-height: 70vh;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            position: relative;
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        .item-card:hover { transform: translateY(-3px); }

        .tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 22px;
            background: rgba(255, 255, 255, 0.4);
            border: 1px dashed rgba(0,0,0,0.15);
            z-index: 2;
        }

        .polaroid-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .card-caption {
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
            text-align: center;
            color: var(--text-main);
            margin-top: 5px;
        }

        .card-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 8px;
            font-weight: 600;
        }

        /* Music Player Card */
        .music-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1rem;
        }
        .vinyl-disc {
            width: 55px;
            height: 55px;
            background: #111;
            border-radius: 50%;
            border: 3px dashed #444;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: spin 4s linear infinite paused;
            flex-shrink: 0;
        }
        .vinyl-disc.playing { animation-play-state: running; }
        .vinyl-center { width: 18px; height: 18px; background: var(--primary); border-radius: 50%; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Floating Toolbar */
        .floating-toolbar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            gap: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tool-btn:hover { background: var(--accent-glow); color: var(--primary); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 100%; max-width: 480px;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.40rem; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            padding: 0.75rem 1rem; border-radius: 10px; color: var(--text-main); outline: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-badge"><i class="fa-solid fa-heart"></i></div>
            <input type="text" id="boardTitle" class="board-title-input" value="straw muural ✰" readonly>
        </div>
        <div class="header-actions">
            <span id="roleIndicator" class="role-badge">👑 Kurucu</span>
            <div id="themeContainer" style="display:none;">
                <select id="themeSelect" onchange="changeTheme(this.value)" style="padding:5px 10px; border-radius:8px; background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color);">
                    <option value="pastel">Pastel Pembe</option>
                    <option value="dark">Gece Modu</option>
                    <option value="y2k">Y2K Kaos</option>
                    <option value="cork">Mantar Pano</option>
                </select>
            </div>
            <button class="btn" onclick="shareLink()"><i class="fa-solid fa-link"></i> Linki Paylaş</button>
        </div>
    </header>

    <div class="workspace">
        <div id="itemsGrid" class="grid-container">
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted);">
                Panolar yükleniyor...
            </div>
        </div>
    </div>

    <!-- Floating Action Toolbar -->
    <div class="floating-toolbar">
        <button class="tool-btn" onclick="openModal('polaroidModal')" title="Polaroid Fotoğraf Ekle"><i class="fa-solid fa-camera"></i></button>
        <button class="tool-btn" onclick="openModal('noteModal')" title="Not Ekle"><i class="fa-solid fa-note-sticky"></i></button>
        <button class="tool-btn" onclick="openModal('musicModal')" title="Şarkı/Müzik Ekle"><i class="fa-solid fa-music"></i></button>
    </div>

    <!-- Modal: Polaroid -->
    <div class="modal" id="polaroidModal">
        <div class="modal-box">
            <h3>📸 Polaroid Fotoğraf Ekle</h3>
            <form onsubmit="addPolaroid(event)">
                <div class="form-group" style="margin-top:1rem;">
                    <label>Adın / Takma Adın</label>
                    <input type="text" id="pAuthor" required placeholder="Örn: Zeynep">
                </div>
                <div class="form-group">
                    <label>Fotoğraf URL (Görsel Adresi)</label>
                    <input type="url" id="pUrl" required placeholder="https://ornek.com/resim.jpg">
                </div>
                <div class="form-group">
                    <label>Alt Not / Açıklama</label>
                    <input type="text" id="pCaption" placeholder="Anı notu...">
                </div>
                <button type="submit" class="btn" style="width:100%; justify-content:center;">Panoya Ekle</button>
                <button type="button" onclick="closeModal('polaroidModal')" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-muted); cursor:pointer;">İptal</button>
            </form>
        </div>
    </div>

    <!-- Modal: Not -->
    <div class="modal" id="noteModal">
        <div class="modal-box">
            <h3>📝 Mini Not Ekle</h3>
            <form onsubmit="addNote(event)">
                <div class="form-group" style="margin-top:1rem;">
                    <label>Adın / Takma Adın</label>
                    <input type="text" id="nAuthor" required placeholder="Örn: Eren">
                </div>
                <div class="form-group">
                    <label>Not İçeriği</label>
                    <textarea id="nContent" rows="3" required placeholder="Mesajını yaz..."></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%; justify-content:center;">Notu Yapıştır</button>
                <button type="button" onclick="closeModal('noteModal')" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-muted); cursor:pointer;">İptal</button>
            </form>
        </div>
    </div>

    <!-- Modal: Müzik -->
    <div class="modal" id="musicModal">
        <div class="modal-box">
            <h3>💿 Şarkı Kartı Ekle</h3>
            <form onsubmit="addMusic(event)">
                <div class="form-group" style="margin-top:1rem;">
                    <label>Adın / Takma Adın</label>
                    <input type="text" id="mAuthor" required placeholder="Örn: Can">
                </div>
                <div class="form-group">
                    <label>Şarkı Adı ve Sanatçı</label>
                    <input type="text" id="mTitle" required placeholder="Örn: Duman - Belki Alışman Lazım">
                </div>
                <div class="form-group">
                    <label>Ses / Şarkı Linki (MP3 veya Ses Dosyası URL)</label>
                    <input type="url" id="mUrl" required placeholder="https://.../sarki.mp3">
                </div>
                <button type="submit" class="btn" style="width:100%; justify-content:center;">CD'yi Ekle</button>
                <button type="button" onclick="closeModal('musicModal')" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-muted); cursor:pointer;">İptal</button>
            </form>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCwN2Ij9zwG2JFxuxHudvOmSl1peH2ClWo",
            authDomain: "crushersagalarlore.firebaseapp.com",
            projectId: "crushersagalarlore",
            storageBucket: "crushersagalarlore.firebasestorage.app",
            messagingSenderId: "163348435559",
            appId: "1:163348435559:web:e340b865fb9ffb3b323ac2",
            measurementId: "G-ETRQV447CS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Rol ve Kurucu Kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const isOwner = !urlParams.has('guest');

        if(isOwner) {
            document.getElementById('roleIndicator').innerText = "👑 Kurucu";
            document.getElementById('themeContainer').style.display = "block";
            document.getElementById('boardTitle').removeAttribute('readonly');
            document.getElementById('boardTitle').addEventListener('blur', (e) => updateBoardTitle(e.target.value));
        } else {
            document.getElementById('roleIndicator').innerText = "🎨 Arkadaş (Misafir)";
            document.getElementById('themeContainer').style.display = "none";
        }

        // Tema Yönetimi
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            db.collection("board_settings").doc("main").set({ theme: themeName }, { merge: true });
        }

        function updateBoardTitle(title) {
            db.collection("board_settings").doc("main").set({ title: title }, { merge: true });
        }

        // Firestore Canlı Dinleme
        db.collection("board_settings").doc("main").onSnapshot((doc) => {
            if(doc.exists) {
                const data = doc.data();
                if(data.theme) {
                    document.documentElement.setAttribute('data-theme', data.theme);
                    document.getElementById('themeSelect').value = data.theme;
                }
                if(data.title && document.activeElement !== document.getElementById('boardTitle')) {
                    document.getElementById('boardTitle').value = data.title;
                }
            }
        });

        db.collection("muural_items").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let items = [];
            snapshot.forEach((doc) => {
                items.push({ id: doc.id, ...doc.data() });
            });
            renderItems(items);
        });

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted);">Henüz bir şey eklenmemiş. Alttaki butonlarla ilk hatırayı sen ekle!</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                if(item.type === 'polaroid') {
                    return `
                        <div class="item-card">
                            <div class="tape"></div>
                            <img src="${escapeHtml(item.url)}" class="polaroid-img" alt="Fotoğraf">
                            <div class="card-caption">${escapeHtml(item.caption || '')}</div>
                            <div class="card-author">~ ${escapeHtml(item.author)}</div>
                        </div>
                    `;
                } else if(item.type === 'note') {
                    return `
                        <div class="item-card" style="background: rgba(255, 248, 196, 0.9); color: #333;">
                            <div class="tape" style="background: rgba(200,200,200,0.5);"></div>
                            <div style="font-family:'Caveat', cursive; font-size:1.4rem; line-height:1.4; word-break:break-word;">${escapeHtml(item.content)}</div>
                            <div class="card-author" style="color: #666;">~ ${escapeHtml(item.author)}</div>
                        </div>
                    `;
                } else if(item.type === 'music') {
                    return `
                        <div class="item-card music-card">
                            <div class="tape"></div>
                            <div class="vinyl-disc" id="disc-${item.id}" onclick="toggleAudio('${item.id}', '${item.url}')">
                                <div class="vinyl-center"></div>
                            </div>
                            <div style="overflow:hidden;">
                                <div style="font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(item.title)}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">Ekleyen: ${escapeHtml(item.author)}</div>
                                <div style="font-size:0.7rem; color:var(--primary); margin-top:4px; font-weight:700; cursor:pointer;" onclick="toggleAudio('${item.id}', '${item.url}')">▶ CD'ye Bas Çalsın</div>
                            </div>
                            <audio id="audio-${item.id}" src="${item.url}" onended="stopDisc('${item.id}')"></audio>
                        </div>
                    `;
                }
            }).join('');
        }

        let currentPlayingAudio = null;
        let currentPlayingDisc = null;

        function toggleAudio(id, url) {
            const audio = document.getElementById(`audio-${id}`);
            const disc = document.getElementById(`disc-${id}`);

            if (currentPlayingAudio && currentPlayingAudio !== audio) {
                currentPlayingAudio.pause();
                currentPlayingAudio.currentTime = 0;
                if(currentPlayingDisc) currentPlayingDisc.classList.remove('playing');
            }

            if (audio.paused) {
                audio.play().catch(e => alert("Ses çalınamadı. Lütfen geçerli bir doğrudan ses/MP3 linki girin."));
                disc.classList.add('playing');
                currentPlayingAudio = audio;
                currentPlayingDisc = disc;
            } else {
                audio.pause();
                disc.classList.remove('playing');
                currentPlayingAudio = null;
                currentPlayingDisc = null;
            }
        }

        function stopDisc(id) {
            const disc = document.getElementById(`disc-${id}`);
            if(disc) disc.classList.remove('playing');
            currentPlayingAudio = null;
            currentPlayingDisc = null;
        }

        // Veritabanına Ekleme Fonksiyonları
        function addPolaroid(e) {
            e.preventDefault();
            const newItem = {
                type: 'polaroid',
                author: document.getElementById('pAuthor').value,
                url: document.getElementById('pUrl').value,
                caption: document.getElementById('pCaption').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('polaroidModal');
                document.getElementById('pAuthor').value = '';
                document.getElementById('pUrl').value = '';
                document.getElementById('pCaption').value = '';
            });
        }

        function addNote(e) {
            e.preventDefault();
            const newItem = {
                type: 'note',
                author: document.getElementById('nAuthor').value,
                content: document.getElementById('nContent').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('noteModal');
                document.getElementById('nAuthor').value = '';
                document.getElementById('nContent').value = '';
            });
        }

        function addMusic(e) {
            e.preventDefault();
            const newItem = {
                type: 'music',
                author: document.getElementById('mAuthor').value,
                title: document.getElementById('mTitle').value,
                url: document.getElementById('mUrl').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('musicModal');
                document.getElementById('mAuthor').value = '';
                document.getElementById('mTitle').value = '';
                document.getElementById('mUrl').value = '';
            });
        }

        function shareLink() {
            const baseUrl = window.location.href.split('?')[0];
            const guestUrl = `${baseUrl}?guest=true`;
            navigator.clipboard.writeText(guestUrl).then(() => {
                alert("Arkadaşların için paylaşım linki kopyalandı! Bu linkle girenler pano temasını değiştiremez ama içerik ekleyebilir.");
            });
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
