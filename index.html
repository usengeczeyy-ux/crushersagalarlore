<!DOCTYPE html>
<html lang="tr" data-theme="pastel">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crushers agalar anı duvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #fcf6f0;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.1);
            --primary: #ff6b8b;
            --primary-hover: #ff4770;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-glow: rgba(255, 107, 139, 0.2);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        [data-theme="pastel"] {
            --bg-main: #fcf6f0;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-color: rgba(230, 210, 200, 0.6);
            --primary: #ff758c;
            --primary-hover: #ff526d;
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-glow: rgba(255, 117, 140, 0.25);
        }

        [data-theme="dark"] {
            --bg-main: #0f1016;
            --bg-card: rgba(24, 26, 38, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-glow: rgba(168, 85, 247, 0.3);
        }

        [data-theme="y2k"] {
            --bg-main: #120024;
            --bg-card: rgba(45, 0, 77, 0.85);
            --border-color: rgba(255, 0, 128, 0.4);
            --primary: #ff007f;
            --primary-hover: #e60073;
            --text-main: #00ffff;
            --text-muted: #ff80df;
            --accent-glow: rgba(255, 0, 127, 0.5);
        }

        [data-theme="cork"] {
            --bg-main: #c49a6c;
            --bg-card: rgba(245, 230, 205, 0.95);
            --border-color: rgba(139, 94, 60, 0.4);
            --primary: #8b5e3c;
            --primary-hover: #6f472b;
            --text-main: #3d2612;
            --text-muted: #7d5b3d;
            --accent-glow: rgba(139, 94, 60, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            padding-bottom: 130px;
        }

        header {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-badge {
            background: var(--primary);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .board-title-input {
            background: transparent;
            border: none;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            outline: none;
            width: 300px;
        }

        .header-actions { display: flex; align-items: center; gap: 10px; }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px var(--accent-glow);
            transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); background: var(--primary-hover); }

        .role-badge {
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--accent-glow);
            color: var(--primary);
            font-weight: 800;
        }

        /* Workspace */
        .workspace {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            min-height: 70vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            position: relative;
            backdrop-filter: blur(8px);
            transition: transform 0.2s;
        }
        .item-card:hover { transform: translateY(-3px); }

        .tape {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 24px;
            background: rgba(255, 255, 255, 0.5);
            border: 1px dashed rgba(0,0,0,0.18);
            z-index: 2;
        }

        .polaroid-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .card-caption {
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            text-align: center;
            color: var(--text-main);
            margin-top: 5px;
        }

        .card-author {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 8px;
            font-weight: 600;
        }

        /* Music Card */
        .music-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 1.2rem;
        }
        .vinyl-disc {
            width: 55px;
            height: 55px;
            background: #111;
            border-radius: 50%;
            border: 3px dashed #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: spin 4s linear infinite paused;
            flex-shrink: 0;
        }
        .vinyl-disc.playing { animation-play-state: running; }
        .vinyl-center { width: 18px; height: 18px; background: var(--primary); border-radius: 50%; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Floating Toolbar */
        .floating-toolbar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 10px 22px;
            border-radius: 40px;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.15rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        .tool-btn:hover { background: var(--accent-glow); color: var(--primary); transform: scale(1.1); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            width: 100%; max-width: 500px;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-height: 85vh;
            overflow-y: auto;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 0.4rem; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border-color);
            padding: 0.75rem 1rem; border-radius: 10px; color: var(--text-main); outline: none;
        }

        .file-picker-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 0.8rem; background: rgba(0,0,0,0.03); border: 2px dashed var(--border-color);
            border-radius: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; font-size: 0.85rem;
        }
        .file-picker-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--accent-glow); }

        /* Picker Grids */
        .picker-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 1rem 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
        }
        .sticker-item {
            font-size: 2.2rem;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .sticker-item:hover { transform: scale(1.15); background: var(--accent-glow); }
        
        .gif-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 1rem 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
        }
        .gif-item {
            height: 85px; object-fit: cover; border-radius: 8px; width: 100%; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
        }
        .gif-item:hover { transform: scale(1.06); border-color: var(--primary); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-badge"><i class="fa-solid fa-fire"></i></div>
            <input type="text" id="boardTitle" class="board-title-input" value="crushers agalar anı duvarı" readonly>
        </div>
        <div class="header-actions">
            <span id="roleIndicator" class="role-badge">👑 Kurucu</span>
            <div id="themeContainer" style="display:none;">
                <select id="themeSelect" onchange="changeTheme(this.value)" style="padding:6px 12px; border-radius:8px; background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); font-weight:600;">
                    <option value="pastel">Pastel Pembe</option>
                    <option value="dark">Gece Modu</option>
                    <option value="y2k">Y2K Kaos</option>
                    <option value="cork">Mantar Pano</option>
                </select>
            </div>
            <button class="btn" onclick="shareLink()"><i class="fa-solid fa-link"></i> Linki Paylaş</button>
        </div>
    </header>

    <div class="workspace">
        <div id="itemsGrid" class="grid-container">
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted);">
                Anılar yükleniyor...
            </div>
        </div>
    </div>

    <!-- Floating Action Toolbar -->
    <div class="floating-toolbar">
        <button class="tool-btn" onclick="openModal('polaroidModal')" title="Galeriden Fotoğraf Ekle"><i class="fa-solid fa-camera"></i></button>
        <button class="tool-btn" onclick="openModal('noteModal')" title="Mini Not Ekle"><i class="fa-solid fa-note-sticky"></i></button>
        <button class="tool-btn" onclick="openModal('gifModal')" title="GIF Seç ve Ekle"><i class="fa-solid fa-clapperboard"></i></button>
        <button class="tool-btn" onclick="openModal('stickerModal')" title="Sticker Seç ve Ekle"><i class="fa-solid fa-face-smile"></i></button>
        <button class="tool-btn" onclick="openModal('drawingModal')" title="Çizim Yap & Ekle"><i class="fa-solid fa-pen-nib"></i></button>
        <button class="tool-btn" onclick="openModal('musicModal')" title="Şarkı Kartı Ekle"><i class="fa-solid fa-music"></i></button>
    </div>

    <!-- Modal: Polaroid / Galeri Fotoğrafı -->
    <div class="modal" id="polaroidModal">
        <div class="modal-box">
            <h3>📸 Galeriden Fotoğraf Ekle</h3>
            <form onsubmit="addPolaroid(event)">
                <div class="form-group" style="margin-top:1rem;">
                    <label>Adın / Takma Adın</label>
                    <input type="text" id="pAuthor" required placeholder="Örn: Agalardan Biri">
                </div>
                <div class="form-group">
                    <label>Cihazından Fotoğraf Seç</label>
                    <label class="file-picker-btn">
                        <i class="fa-solid fa-image"></i> <span id="fileNameDisplay">Galeriden Seç</span>
                        <input type="file" id="pImageFile" accept="image/*" required style="display:none;" onchange="handleImageSelect(event)">
                    </label>
                </div>
                <div class="form-group">
                    <label>Alt Not / Açıklama</label>
                    <input type="text" id="pCaption" placeholder="Anı notu...">
                </div>
                <button type="submit" class="btn" style="width:100%; justify-content:center;">Panoya Ekle</button>
                <button type="button" onclick="closeModal('polaroidModal')" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-muted); cursor:pointer;">İptal</button>
            </form>
        </div>
    </div>

    <!-- Modal: Not -->
    <div class="modal" id="noteModal">
        <div class="modal-box">
            <h3>📝 Mini Not Ekle</h3>
            <form onsubmit="addNote(event)">
                <div class="form-group" style="margin-top:1rem;">
                    <label>Adın / Takma Adın</label>
                    <input type="text" id="nAuthor" required placeholder="Örn: Eren">
                </div>
                <div class="form-group">
                    <label>Not İçeriği</label>
                    <textarea id="nContent" rows="3" required placeholder="Mesajını yaz..."></textarea>
                </div>
                <button type="submit" class="btn" style="width:100%; justify-content:center;">Notu Yapıştır</button>
                <button type="button" onclick="closeModal('noteModal')" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-muted); cursor:pointer;">İptal</button>
            </form>
        </div>
    </div>

            <form onsubmit="addMusic(event)">
                <div class="form-group" style="margin-top:1rem;">

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyCwN2Ij9zwG2JFxuxHudvOmSl1peH2ClWo",
            authDomain: "crushersagalarlore.firebaseapp.com",
            projectId: "crushersagalarlore",
            storageBucket: "crushersagalarlore.firebasestorage.app",
            messagingSenderId: "163348435559",
            appId: "1:163348435559:web:e340b865fb9ffb3b323ac2",
            measurementId: "G-ETRQV447CS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Rol ve Kurucu Kontrolü
        const urlParams = new URLSearchParams(window.location.search);
        const isOwner = !urlParams.has('guest');

        if(isOwner) {
            document.getElementById('roleIndicator').innerText = "👑 Kurucu";
            document.getElementById('themeContainer').style.display = "block";
            document.getElementById('boardTitle').removeAttribute('readonly');
            document.getElementById('boardTitle').addEventListener('blur', (e) => updateBoardTitle(e.target.value));
        } else {
            document.getElementById('roleIndicator').innerText = "🎨 Arkadaş (Misafir)";
            document.getElementById('themeContainer').style.display = "none";
        }

        // Tema Yönetimi
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            db.collection("board_settings").doc("main").set({ theme: themeName }, { merge: true });
        }

        function updateBoardTitle(title) {
            db.collection("board_settings").doc("main").set({ title: title }, { merge: true });
        }

        // Firestore Canlı Dinleme
        db.collection("board_settings").doc("main").onSnapshot((doc) => {
            if(doc.exists) {
                const data = doc.data();
                if(data.theme) {
                    document.documentElement.setAttribute('data-theme', data.theme);
                    document.getElementById('themeSelect').value = data.theme;
                }
                if(data.title && document.activeElement !== document.getElementById('boardTitle')) {
                    document.getElementById('boardTitle').value = data.title;
                }
            }
        });

        db.collection("muural_items").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            let items = [];
            snapshot.forEach((doc) => {
                items.push({ id: doc.id, ...doc.data() });
            });
            renderItems(items);
        });

        function renderItems(items) {
            const grid = document.getElementById('itemsGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted);">Henüz bir şey eklenmemiş. Alttaki butonlarla ilk hatırayı sen ekle!</div>`;
                return;
            }

            grid.innerHTML = items.map(item => {
                if(item.type === 'polaroid' || item.type === 'gif') {
                    return `
                        <div class="item-card">
                            <div class="tape"></div>
                            <img src="${escapeHtml(item.url)}" class="polaroid-img" alt="Görsel/GIF">
                            ${item.caption ? `<div class="card-caption">${escapeHtml(item.caption)}</div>` : ''}
                            <div class="card-author">~ ${escapeHtml(item.author || 'Aga')}</div>
                        </div>
                    `;
                } else if(item.type === 'note') {
                    return `
                        <div class="item-card" style="background: rgba(255, 248, 196, 0.95); color: #333;">
                            <div class="tape" style="background: rgba(200,200,200,0.5);"></div>
                            <div style="font-family:'Caveat', cursive; font-size:1.45rem; line-height:1.4; word-break:break-word;">${escapeHtml(item.content)}</div>
                            <div class="card-author" style="color: #666;">~ ${escapeHtml(item.author)}</div>
                        </div>
                    `;
                } else if(item.type === 'sticker') {
                    return `
                        <div class="item-card" style="text-align:center; padding:1.5rem; background:rgba(255,255,255,0.6);">
                            <div style="font-size:3.5rem; margin-bottom:5px;">${item.emoji}</div>
                            <div class="card-author">Sticker</div>
                        </div>
                    `;
                } else if(item.type === 'drawing') {
                    return `
                        <div class="item-card">
                            <div class="tape"></div>
                            <img src="${item.url}" class="polaroid-img" style="background:#fff;" alt="Çizim">
                            <div class="card-author">Çizen: ~ ${escapeHtml(item.author)}</div>
                        </div>
                    `;
                } else if(item.type === 'music') {
                    return `
                        <div class="item-card music-card">
                            <div class="tape"></div>
                            <div class="vinyl-disc" id="disc-${item.id}" onclick="toggleAudio('${item.id}', '${item.url}')">
                                <div class="vinyl-center"></div>
                            </div>
                            <div style="overflow:hidden;">
                                <div style="font-weight:700; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(item.title)}</div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">Ekleyen: ${escapeHtml(item.author)}</div>
                                <div style="font-size:0.7rem; color:var(--primary); margin-top:4px; font-weight:700; cursor:pointer;" onclick="toggleAudio('${item.id}', '${item.url}')">▶ CD'ye Bas Çalsın</div>
                            </div>
                            <audio id="audio-${item.id}" src="${item.url}" onended="stopDisc('${item.id}')"></audio>
                        </div>
                    `;
                }
            }).join('');
        }

        // Cihazdan Görsel Seçme Mantığı
        let selectedBase64Image = "";
        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('fileNameDisplay').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    selectedBase64Image = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Çizim Tahtası Mantığı
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function startPosition(e) { painting = true; draw(e); }
        function endPosition() { painting = false; ctx.beginPath(); }
        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition);
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw);

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function saveDrawing() {
            const author = document.getElementById('dAuthor').value.trim() || "Biri";
            const dataUrl = canvas.toDataURL();
            db.collection("muural_items").add({
                type: 'drawing',
                author: author,
                url: dataUrl,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeModal('drawingModal');
                clearCanvas();
                document.getElementById('dAuthor').value = '';
            });
        }

        function addSticker(emoji) {
            db.collection("muural_items").add({
                type: 'sticker',
                emoji: emoji,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeModal('stickerModal');
            });
        }

        function addGif(url) {
            db.collection("muural_items").add({
                type: 'gif',
                author: 'Aga',
                url: url,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                closeModal('gifModal');
            });
        }

        let currentPlayingAudio = null;
        let currentPlayingDisc = null;

        function toggleAudio(id, url) {
            const audio = document.getElementById(`audio-${id}`);
            const disc = document.getElementById(`disc-${id}`);

            if (currentPlayingAudio && currentPlayingAudio !== audio) {
                currentPlayingAudio.pause();
                currentPlayingAudio.currentTime = 0;
                if(currentPlayingDisc) currentPlayingDisc.classList.remove('playing');
            }

            if (audio.paused) {
                audio.play().catch(e => alert("Ses çalınamadı. Lütfen geçerli bir doğrudan ses/MP3 linki girin."));
                disc.classList.add('playing');
                currentPlayingAudio = audio;
                currentPlayingDisc = disc;
            } else {
                audio.pause();
                disc.classList.remove('playing');
                currentPlayingAudio = null;
                currentPlayingDisc = null;
            }
        }

        function stopDisc(id) {
            const disc = document.getElementById(`disc-${id}`);
            if(disc) disc.classList.remove('playing');
            currentPlayingAudio = null;
            currentPlayingDisc = null;
        }

        // Veritabanına Ekleme Fonksiyonları
        function addPolaroid(e) {
            e.preventDefault();
            if (!selectedBase64Image) {
                alert("Lütfen cihazından bir fotoğraf seç!");
                return;
            }
            const newItem = {
                type: 'polaroid',
                author: document.getElementById('pAuthor').value,
                url: selectedBase64Image,
                caption: document.getElementById('pCaption').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('polaroidModal');
                document.getElementById('pAuthor').value = '';
                document.getElementById('pCaption').value = '';
                document.getElementById('pImageFile').value = '';
                document.getElementById('fileNameDisplay').innerText = 'Galeriden Seç';
                selectedBase64Image = "";
            });
        }

        function addNote(e) {
            e.preventDefault();
            const newItem = {
                type: 'note',
                author: document.getElementById('nAuthor').value,
                content: document.getElementById('nContent').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('noteModal');
                document.getElementById('nAuthor').value = '';
                document.getElementById('nContent').value = '';
            });
        }

        function addMusic(e) {
            e.preventDefault();
            const newItem = {
                type: 'music',
                author: document.getElementById('mAuthor').value,
                title: document.getElementById('mTitle').value,
                url: document.getElementById('mUrl').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            db.collection("muural_items").add(newItem).then(() => {
                closeModal('musicModal');
                document.getElementById('mAuthor').value = '';
                document.getElementById('mTitle').value = '';
                document.getElementById('mUrl').value = '';
            });
        }

        function shareLink() {
            const baseUrl = window.location.href.split('?')[0];
            const guestUrl = `${baseUrl}?guest=true`;
            navigator.clipboard.writeText(guestUrl).then(() => {
                alert("Arkadaşların için paylaşım linki kopyalandı! Bu linkle girenler pano temasını değiştiremez ama içerik ekleyebilir.");
            });
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
